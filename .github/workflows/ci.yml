name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test --scratch-path "$RUNNER_TEMP/minget-tests"
      - name: Build application bundle
        run: ./scripts/build.sh
